- # ====== Region: Interviews ==================================
  id: 16459056760820606
  identification: 
    name: Interviews
    type: Cards

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      SELECT
          i.id,
          u.first_name || ' ' || u.last_name AS user_name,
          ja.role_title,
          c.name AS company,
          i.interview_date,
          i.stage,
          i.result,
          i.feedback,
          i.interviewer_name AS interviewer,
      
          CASE i.result
              WHEN 'Passed' THEN 'u-color-5'
              WHEN 'Failed' THEN 'u-color-14'
              WHEN 'Pending' THEN 'u-color-8'
              WHEN 'Cancelled' THEN 'u-color-1'
          END AS badge_class
      
      FROM interviews i
      JOIN job_applications ja
          ON i.application_id = ja.id
      JOIN companies c
          ON ja.company_id = c.id
      JOIN users u
          ON ja.user_id = u.id
      ORDER BY i.interview_date DESC

  order-by: 
    type: None

  layout: 
    sequence: 30
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Cards Container
    template-options: 
    - '#DEFAULT#'
    - t-CardsRegion--hideHeader js-addHiddenHeadingRoleDesc
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
