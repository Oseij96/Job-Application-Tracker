- # ====== Region: Application Summary =========================
  id: 16338488386013745
  identification: 
    name: Application Summary
    type: Cards

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      SELECT 'Total Applications' AS title, COUNT(*) AS value
      FROM job_applications
      UNION ALL
      SELECT 'Interviews', COUNT(*)
      FROM interviews
      UNION ALL
      SELECT 'Offers', COUNT(*)
      FROM job_applications
      WHERE status = 'Offer'
      UNION ALL
      SELECT 'Accepted', COUNT(*)
      FROM job_applications
      WHERE status = 'Accepted'
      UNION ALL
      SELECT 'Rejected', COUNT(*)
      FROM job_applications
      WHERE status = 'Rejected';

  order-by: 
    type: None

  layout: 
    sequence: 35
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Cards Container
    template-options: 
    - '#DEFAULT#'
    - t-CardsRegion--hideHeader js-addHiddenHeadingRoleDesc
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    region-display-selector: false
    exclude-title-from-translation: false

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    id: 16338540194013746
    appearance: 
      layout: Grid
      grid-columns: Auto

    title: 
      advanced-formatting: false
      column: VALUE

    subtitle: 
      advanced-formatting: false

    body: 
      advanced-formatting: false
