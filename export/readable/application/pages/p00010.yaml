- # ====== Page Item: P10_APPLICATION_ID =======================
  id: 16493571020124628
  identification: 
    name: P10_APPLICATION_ID
    type: Select List

  label: 
    label: Applications
    alignment: Left

  settings: 
    page-action-on-selection: None

  multiple-values: 
    type: No

  layout: 
    sequence: 20
    region: Add/Edit Interview # 16492843387124621
    slot: BODY
    alignment: Left
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic
    label-column-span: Page Template Default

  appearance: 
    template: Required - Floating
    template-options: 
    - '#DEFAULT#'
    height: 1

  validation: 
    value-required: true

  list-of-values: 
    type: SQL Query
    sql-query: |
      SELECT 
          u.first_name || ' ' || u.last_name ||
          ' applying for ' ||
          ja.role_title || ' at ' || c.name AS display_value,
          ja.id AS return_value
      FROM job_applications ja
      JOIN users u ON u.id = ja.user_id
      JOIN companies c ON c.id = ja.company_id
      ORDER BY u.first_name, u.last_name, c.name
    display-extra-values: true
    display-null-value: true
    null-display-value: '-- Select Application --'

  advanced: 
    warn-on-unsaved-changes: Page Default

  source: 
    form-region: Add/Edit Interview # 16492843387124621
    column: APPLICATION_ID
    data-type: NUMBER
    query-only: false
    primary-key: false

  session-state: 
    storage: Per Request (Memory Only)

  quick-picks: 
    show-quick-picks: false

  security: 
    session-state-protection: Unrestricted
    store-value-encrypted-in-session-state: true
    restricted-characters: All characters can be saved.

