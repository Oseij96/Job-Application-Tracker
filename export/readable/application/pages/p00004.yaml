- # ====== Region: Application Pipeline ========================
  id: 16320568898285824
  identification: 
    name: Application Pipeline
    type: Cards

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      SELECT
          ja.id,
          ja.role_title,
          ja.status,
          ja.applied_date,
          ja.salary,
          c.name AS company_name,
          u.first_name || ' ' || u.last_name AS user_name,
      
          CASE ja.status
              WHEN 'Applied' THEN 'u-color-1'
              WHEN 'Interview' THEN 'u-color-8'
              WHEN 'Offer' THEN 'u-color-4'
              WHEN 'Accepted' THEN 'u-color-5'
              WHEN 'Rejected' THEN 'u-color-14'
          END AS badge_class
      
      FROM job_applications ja
      JOIN companies c
          ON ja.company_id = c.id
      JOIN users u
          ON ja.user_id = u.id
      WHERE :P4_STATUS_FILTER IS NULL
          OR ja.status = :P4_STATUS_FILTER
      ORDER BY ja.applied_date DESC;

  order-by: 
    type: Item
    item: 
      item-name: P4_ORDER_BY
      order-bys: 
      - key: ROLE_TITLE
        clause: '"ROLE_TITLE" asc'

      - key: STATUS
        clause: '"STATUS" asc'

  layout: 
    sequence: 10
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Cards Container
    template-options: 
    - '#DEFAULT#'
    - t-CardsRegion--hideHeader js-addHiddenHeadingRoleDesc
    render-components: Above Content

  accessibility: 
    use-landmark: true
