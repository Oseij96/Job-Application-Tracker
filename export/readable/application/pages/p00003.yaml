- # ====== Process: Get Old Status =============================
  id: 16460323512820619
  identification: 
    name: Get Old Status
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      BEGIN
          SELECT status
          INTO :P3_OLD_STATUS
          FROM job_applications
          WHERE id = :P3_ID;
      EXCEPTION
          WHEN NO_DATA_FOUND THEN
              :P3_OLD_STATUS := NULL;
      END;

  execution: 
    sequence: 1
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    type: Item is NOT NULL
    item: P3_ID

