- # ====== Region: Job Application Report ======================
  id: 16337417862013735
  identification: 
    name: Job Application Report
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      SELECT
          ja.id,
          NVL(u.first_name || ' ' || u.last_name, 'Unknown User') AS user_name,
          NVL(c.name, 'Unknown Company') AS company_name,
          ja.role_title,
          ja.salary,
          ja.status,
          ja.applied_date,
          ja.notes
      FROM job_applications ja
      LEFT JOIN users u
          ON ja.user_id = u.id
      LEFT JOIN companies c
          ON ja.company_id = c.id
      ORDER BY ja.applied_date DESC;

  layout: 
    sequence: 10
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

